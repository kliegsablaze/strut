name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # tests/plan.test.mjs plans the pages with the host's own planner
      - uses: actions/checkout@v4
        with:
          repository: charlesvestal/schwung
          path: .schwung
      - name: Run tests
        run: SCHWUNG=.schwung bash tests/run.sh

  # A device build of every push, so a version can be tried on the Move
  # without building locally: download the artifact, then
  #   scripts/install.sh strut-module.tar.gz
  build:
    runs-on: ubuntu-latest
    # a stuck package mirror once held this job for over 16 minutes; fail
    # fast instead, and retry downloads
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Cross-compile for the Move (aarch64)
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq gcc-aarch64-linux-gnu
          ./scripts/build.sh
          # the tarball carries the library and its sources
          wavs=$(tar -tzf dist/strut-module.tar.gz | grep -c '^strut/samples/.*\.wav$')
          echo "tarball: $(du -h dist/strut-module.tar.gz | cut -f1), $wavs samples"
          test "$wavs" -eq "$(find src/samples -name '*.wav' | wc -l)"
          tar -tzf dist/strut-module.tar.gz | grep -qx 'strut/samples/SOURCES.md'
          # the bench, static so it runs whatever the Move's C library
          mkdir -p build
          aarch64-linux-gnu-gcc -std=c11 -O3 -ffp-contract=fast -static -Wall -Wextra -Werror -Isrc/dsp \
            tools/bench.c src/dsp/*.c -o build/bench-aarch64 -lm -lpthread
      - uses: actions/upload-artifact@v4
        with:
          name: strut-module
          path: dist/strut-module.tar.gz
      # scripts/bench.sh runs it on the Move: what Strut costs there
      - uses: actions/upload-artifact@v4
        with:
          name: strut-bench
          path: build/bench-aarch64
